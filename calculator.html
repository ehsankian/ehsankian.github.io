<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/css/bootstrap.css">
    <link href="/static/css/index.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/calculator.css">

    <title>Homepage</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="">Ehsan Kian</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                        <a class="nav-link" href="#">Features</a>
                        <a class="nav-link" href="#">Pricing</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main class="bggrad p-3">
        <section class="col-lg-10 col-xxl-7 container-fluid border border-black rounded bg-body-tertiary mb-1 ">
            <h2 class="pt-3">Lucky Draw</h2>
            <hr>
            <div class="row mx-0">
                <div class="col-6 col-md-5">
                    <label for="draw" class="form-label">Draw</label>
                    <select id="draw" class="form-select">
                        <option value="0" selected>Choose...</option>
                        <option value="1">Mythic Character</option>
                        <option value="2">Mythic Gun</option>
                        <option value="3">Legendary Character</option>
                        <option value="4">Legendary Gun (Reactive)</option>
                        <option value="5">Legendary Gun (Non-reactive)</option>
                        <option value="6">Legendary Gun (7 Draws)</option>
                    </select>
                    <div id="drawFeedback" class="invalid-feedback">
                        Please select a valid Draw.
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <label for="price" class="form-label">First draw price</label>
                    <select id="price" class="form-select">
                        <option value="0" selected>Choose...</option>
                    </select>
                    <div class="invalid-feedback">
                        Please select a first draw price.
                    </div>
                </div>
                <div class="col-12 col-md-3">
                    <label for="discount" class="form-label">Discount</label>
                    <select id="discount" class="form-select">
                        <option value="0" id="zeroDiscount">0%</option>
                        <option value="10">10%</option>
                        <option value="15">15%</option>
                        <option value="20">20%</option>
                    </select>
                </div>
            </div>
            <hr class="mb-0">
            <div class="row mx-0">
                <div class="col-6 py-3 col-md-4 border-end left-border">
                    <div class="input-group mb-3">
                        <input type="number" class="form-control" name="cp" id="inputCP">
                        <span for="inputCP" class="input-group-text">CP</span>
                        <div class="invalid-feedback">
                            CP > 0
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary w-100" id="calculate">Calculate</button>
                    <div class="mt-3">

                        <input type="checkbox" name="upgrade" id="up">
                        <label for="up">Using remaining CP to upgrade</label>
                    </div>
                </div>
                <div class="col-6 py-3 col-md-4 border-end">
                    <div class="row">
                        <p class="">Cost:</p>
                        <div class="" id="result"></div>
                        <hr class="my-3">
                        <p class="">Total: <span id="total"></span></p>

                    </div>

                </div>
                <hr class="d-md-none">
                <div class="col-12 pt-3 col-md-4">
                    <p class="">Awesome! With your current <span id="userCP" class="red">0</span>
                        CP, you're all set to spin the Lucky Draw <span id="numberOfSpins" class="red">0</span> times.
                        After those spins, you’ll still have <span id="remainingCP" class="red">0</span> CP remaining.
                    </p>
                </div>
            </div>
        </section>
        <section class="col-lg-10 col-xxl-7 container-fluid p-3 border border-black rounded bg-body-tertiary"
            id="upgrade">
            <h2>Upgrade</h2>
            <hr class="mb-4"> 
            <div class="row mx-0">
                <div class="col">

                </div>
            </div>
        </section>

    </main>
    <footer>

    </footer>

    <script src="/static/js/calculator.js"></script>
    <script src="/static/js/bootstrap.bundle.js"></script>
</body>

</html>
